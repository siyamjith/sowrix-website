<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d1c">
<title>Sign In | SOWRIX Technologies</title>
<style>
:root{color-scheme:dark;--bg:#070b18;--panel:rgba(15,23,42,.88);--line:rgba(148,163,184,.2);--muted:#9aa9c1;--blue:#3b82f6;--cyan:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,rgba(37,99,235,.22),transparent 35%),radial-gradient(ellipse at 90% 90%,rgba(8,145,178,.18),transparent 32%),var(--bg);color:#f8fafc;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.glow{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent)}
.card{position:relative;width:min(100%,450px);padding:clamp(25px,6vw,42px);border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 25px 90px rgba(0,0,0,.42);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:28px}.logo{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(59,130,246,.2))}.brandname{font-size:22px;font-weight:850;letter-spacing:.16em}.brandname span{display:block;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.22em;margin-top:2px}
.eyebrow{text-align:center;color:#67e8f9;text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:800;margin:0 0 9px}h1{text-align:center;font-size:clamp(27px,6vw,34px);line-height:1.2;letter-spacing:-.04em;margin:0} .sub{text-align:center;color:var(--muted);margin:12px 0 28px;font-size:14px}
label{display:block;font-size:12px;font-weight:700;color:#dbeafe;margin:17px 0 8px}input{display:block;width:100%;min-height:49px;padding:13px 14px;border:1px solid #334155;border-radius:12px;background:rgba(2,6,23,.68);color:white;font:inherit;outline:none;transition:border .2s,box-shadow .2s}input::placeholder{color:#64748b}input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.17)}
button{width:100%;min-height:50px;margin-top:23px;border:0;border-radius:12px;background:linear-gradient(100deg,#2563eb,#0891b2);color:white;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 10px 25px rgba(37,99,235,.2);transition:transform .15s,opacity .15s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.65;cursor:wait;transform:none}
#message{display:none;margin:15px 0 0;padding:11px 12px;border:1px solid rgba(248,113,113,.3);border-radius:10px;background:rgba(127,29,29,.18);color:#fca5a5;font-size:13px;overflow-wrap:anywhere}#message.show{display:block}
.secure{text-align:center;color:#64748b;font-size:11px;margin:22px 0 0}.secure span{color:#34d399}
@media(max-width:420px){body{padding:14px}.card{border-radius:20px}.brandname{font-size:19px}}
</style>
</head>
<body><div class="glow" aria-hidden="true"></div>
<main class="card">
  <div class="brand"><img src="assets/logo.png" class="logo" alt="SOWRIX logo" onerror="this.style.display='none'"><div class="brandname">SOWRIX<span>TECHNOLOGIES</span></div></div>
  <p class="eyebrow">Secure Workspace</p>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to your Admin or HR dashboard.</p>
  <form id="loginForm">
    <label for="email">Work email</label>
    <input type="email" id="email" name="email" autocomplete="username" placeholder="you@sowrix.com" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
    <button id="loginButton" type="submit">Sign in securely&nbsp; →</button>
    <p id="message" role="status" aria-live="polite"></p>
  </form>
  <p class="secure"><span>●</span> Secure authentication powered by Supabase</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const message = document.getElementById('message');
  const button = document.getElementById('loginButton');
  const form = document.getElementById('loginForm');
  const showError = text => { message.textContent = text; message.classList.add('show'); };
  if (!window.supabase) {
    showError('Login service could not load. Check your internet connection and refresh.');
    button.disabled = true;
    return;
  }
  const authClient = window.supabase.createClient(
    'https://uddbaktgyrfnqatieejk.supabase.co',
    'sb_publishable_20IfLakUj33gS5OD--xOOg_NqI-7oCW'
  );
  form.addEventListener('submit', async event => {
    event.preventDefault();
    message.classList.remove('show');
    message.textContent = '';
    button.disabled = true;
    button.textContent = 'Signing in…';
    try {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const { data, error } = await authClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      const role = String(data.user?.app_metadata?.role || '').toLowerCase();
      if (!['admin', 'hr'].includes(role)) {
        await authClient.auth.signOut();
        throw new Error('This account has no Admin/HR role yet. In Supabase Auth, assign app_metadata.role as "admin" or "hr", then sign in again.');
      }
      localStorage.setItem('sowrixUser', JSON.stringify({
        id: data.user.id, email: data.user.email, role
      }));
      window.location.href = role === 'admin' ? 'index.html#/admin' : 'index.html#/hr';
    } catch (error) {
      console.error('SOWRIX sign-in error:', error);
      const text = error?.message || 'Login failed. Please try again.';
      showError(text.includes('Invalid login credentials')
        ? 'Email or password is incorrect. Check the credentials and try again.'
        : text);
    } finally {
      button.disabled = false;
      button.textContent = 'Sign in securely  →';
    }
  });
})();
</script>
</body>
</html>
