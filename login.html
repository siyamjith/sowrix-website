<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOWRIX Secure Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b18;color:#fff;font:16px Arial,sans-serif}.box{width:min(92vw,430px);padding:34px;background:#111827;border:1px solid #263247;border-radius:18px}.logo{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto 14px}h1,p{text-align:center}p{color:#9ca3af;margin-bottom:26px}label{display:block;margin:14px 0 7px;color:#cbd5e1}input{width:100%;padding:13px;border-radius:9px;border:1px solid #334155;background:#0b1220;color:#fff}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:9px;background:linear-gradient(90deg,#087cff,#00c8e8);color:white;font-size:16px;font-weight:bold;cursor:pointer}#message{min-height:24px;color:#fca5a5;font-size:14px;overflow-wrap:anywhere}</style></head><body><main class="box"><img src="assets/logo.png" class="logo" alt="SOWRIX"><h1>SOWRIX</h1><p>Secure Admin & HR Access</p><form id="loginForm"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required><button id="loginButton" type="submit">Sign in</button><p id="message" role="status" aria-live="polite"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const authClient=window.supabase.createClient('https://uddbaktgyrfnqatieejk.supabase.co','sb_publishable_20IfLakUj33gS5OD--xOOg_NqI-7oCW');
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('loginButton'),message=document.getElementById('message');button.disabled=true;message.textContent='Signing in…';try{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error}=await authClient.auth.signInWithPassword({email,password});if(error)throw error;const {data:roleRow,error:roleError}=await authClient.from('user_roles').select('role').eq('user_id',data.user.id).maybeSingle();if(roleError)throw roleError;if(!roleRow||!['admin','hr'].includes(roleRow.role)){await authClient.auth.signOut();throw new Error('This account has no Admin/HR role. Add its user_id and role in Supabase.')}localStorage.setItem('sowrixUser',JSON.stringify({id:data.user.id,email:data.user.email,role:roleRow.role}));location.href=roleRow.role==='admin'?'index.html#/admin':'index.html#/hr';}catch(err){console.error('Login failed:',err);message.textContent=err.message||'Login failed.'}finally{button.disabled=false}});
</script></body></html>
